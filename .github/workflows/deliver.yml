name: Deliver Daily Knowledge

on:
  push:
    branches: [main]
    paths:
      - 'latest/digest.txt'

jobs:
  deliver:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4

      - name: Send digest to Telegram and ntfy
        run: |
          DIGEST=$(cat latest/digest.txt)
          TITLE=$(head -n 1 latest/digest.txt)
          IMAGE_URL=""
          if [ -f latest/image_url.txt ]; then
            IMAGE_URL=$(head -n 1 latest/image_url.txt)
          fi

          if [ -n "$IMAGE_URL" ]; then
            curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto" \
              --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
              --data-urlencode photo="${IMAGE_URL}" \
              --data-urlencode caption="${TITLE}"
          fi

          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="${DIGEST}"

          if [ -n "$IMAGE_URL" ]; then
            curl -sf --data-binary "${DIGEST}" \
              -H "X-Attach: ${IMAGE_URL}" \
              -H "X-Title: ${TITLE}" \
              "https://ntfy.sh/${NTFY_TOPIC}"
          else
            curl -sf --data-binary "${DIGEST}" "https://ntfy.sh/${NTFY_TOPIC}"
          fi
